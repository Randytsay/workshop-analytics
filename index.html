<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作坊簽到分析儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Loading screen */
    #loading-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
    }
    #loading-screen .spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
    #loading-screen p { color: var(--text-dim); font-size: 15px; }
    #loading-screen .error-msg { color: var(--danger); font-size: 14px; margin-top: 12px; text-align: center; max-width: 400px; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .header-inner h1 { font-size: 20px; font-weight: 700; color: var(--primary); }
    .header-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    .btn:hover { background: var(--primary-dark); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

    main { max-width: 1400px; margin: 0 auto; padding: 24px; display: none; }
    main.visible { display: block; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .stat-card .label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
    .stat-card .value { font-size: 32px; font-weight: 800; color: var(--primary); }
    .stat-card .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .stat-card.warning .value { color: var(--warning); }
    .stat-card.success .value { color: var(--success); }

    .filters { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .filters label { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
    .filters select, .filters input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 13px; min-width: 140px; }
    .filters select:focus, .filters input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }

    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .chart-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
    .chart-wrap { position: relative; height: 260px; }
    .chart-wrap.tall { height: 320px; }

    .tables-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
    .table-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 24px; }
    .table-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; background: var(--bg); color: var(--text-dim); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    tr:hover { background: rgba(99,102,241,0.08); }
    .table-scroll { max-height: 400px; overflow-y: auto; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-primary { background: rgba(99,102,241,0.2); color: #818cf8; }
    .badge-success { background: rgba(34,197,94,0.2); color: #4ade80; }
    .badge-warning { background: rgba(245,158,11,0.2); color: #fbbf24; }
    .badge-danger { background: rgba(239,68,68,0.2); color: #f87171; }

    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--card); border: 1px solid var(--border); padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 1000; transform: translateY(100px); opacity: 0; transition: all 0.3s; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }

    @media (max-width: 768px) {
      .charts-grid, .tables-grid { grid-template-columns: 1fr; }
      .stat-card .value { font-size: 24px; }
    }
  </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen">
  <div class="spinner"></div>
  <p>正在讀取 Google Sheets 資料...</p>
  <div class="error-msg" id="loadingError"></div>
</div>

<header>
  <div class="header-inner">
    <h1>📊 工作坊簽到分析儀表板</h1>
    <div class="header-controls">
      <button class="btn" onclick="location.reload()">🔄 重新整理</button>
      <button class="btn btn-outline" onclick="exportCSV()">📥 匯出 CSV</button>
    </div>
  </div>
</header>

<main id="mainContent">
  <!-- Stats -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="label">總簽到人次</div>
      <div class="value" id="statTotal">—</div>
      <div class="sub" id="statDateRange">—</div>
    </div>
    <div class="stat-card">
      <div class="label">獨立人數</div>
      <div class="value" id="statUnique">—</div>
      <div class="sub">不同姓名</div>
    </div>
    <div class="stat-card warning">
      <div class="label">學習夥伴</div>
      <div class="value" id="statLearner">—</div>
      <div class="sub">學員身份</div>
    </div>
    <div class="stat-card success">
      <div class="label">主持人/場控</div>
      <div class="value" id="statHost">—</div>
      <div class="sub">工作人員</div>
    </div>
    <div class="stat-card">
      <div class="label">經營工作坊</div>
      <div class="value" id="statBiz">—</div>
      <div class="sub">報名場次最多</div>
    </div>
    <div class="stat-card">
      <div class="label">活躍小C團隊</div>
      <div class="value" id="statTeams">—</div>
      <div class="sub">有簽到記錄</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <label>📅 工作坊日期</label>
    <input type="date" id="filterDateFrom">
    <span style="color:var(--text-dim)">~</span>
    <input type="date" id="filterDateTo">
    <label>🏷️ 類別</label>
    <select id="filterType"><option value="">全部</option></select>
    <label>👤 身份</label>
    <select id="filterRole"><option value="">全部</option></select>
    <label>🗺️ 區域</label>
    <select id="filterArea"><option value="">全部</option></select>
    <label>🔖 聘階</label>
    <select id="filterRank"><option value="">全部</option></select>
    <label>👥 小C</label>
    <select id="filterTeam"><option value="">全部</option></select>
    <button class="btn btn-outline" onclick="resetFilters()">🔄 清除篩選</button>
  </div>

  <!-- Charts Row 1 -->
  <div class="charts-grid">
    <div class="chart-card">
      <h3>📈 每月簽到趨勢</h3>
      <div class="chart-wrap tall"><canvas id="chartTrend"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>🏷️ 工作坊類別分佈</h3>
      <div class="chart-wrap"><canvas id="chartType"></canvas></div>
      <div style="margin-top:12px;height:200px"><canvas id="chartTypeBar"></canvas></div>
    </div>
  </div>

  <!-- Charts Row 2 -->
  <div class="charts-grid">
    <div class="chart-card">
      <h3>👥 參與者身份分佈</h3>
      <div class="chart-wrap"><canvas id="chartRole"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>🔖 聘階分佈</h3>
      <div class="chart-wrap"><canvas id="chartRank"></canvas></div>
    </div>
  </div>

  <!-- Charts Row 3 -->
  <div class="charts-grid">
    <div class="chart-card">
      <h3>👨‍👩‍👧‍👦 小C團隊表現（前10名）</h3>
      <div class="chart-wrap tall"><canvas id="chartTeam"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>🗺️ 區域分佈</h3>
      <div class="chart-wrap"><canvas id="chartArea"></canvas></div>
    </div>
  </div>

  <!-- Tables -->
  <div class="tables-grid">
    <div class="table-card" style="margin-top:0">
      <h3>📅 每日簽到記錄（最近30筆）</h3>
      <div class="table-scroll">
        <table id="tableRecent"><thead></thead><tbody></tbody></table>
      </div>
    </div>
    <div class="table-card" style="margin-top:0">
      <h3>🏆 小C團隊排名</h3>
      <div class="table-scroll">
        <table id="tableTeams"><thead></thead><tbody></tbody></table>
      </div>
    </div>
  </div>

  <!-- Top participants -->
  <div class="table-card">
    <h3>⭐ 活躍參與者（前20名）</h3>
    <div class="table-scroll">
      <table id="tableTop"><thead></thead><tbody></tbody></table>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ========== Config ==========
const API_KEY = 'v2.BYXneOcP6Bv73dvpyiE_tUZQtFxobX4KB3ruQWCMxOfveEkzVnmOwUk5ugf9H2K_QjOQRG4jxEJkONVa6oJ0K38OBygg0LtRx2lw-hF5zIU6WC9Jrz5t3rlx';
const SHEET_ID = '1QEytkFQTYVgkwCxgcC4BKrvf9ZkC_GApJd1U6JQAnsI';

// ========== State ==========
let allData = [];
let filteredData = [];
const chartInstances = {};

// ========== Toast ==========
function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 4000);
}

function showError(msg) {
  document.getElementById('loadingError').textContent = msg;
  document.getElementById('loadingError').style.display = 'block';
}

// ========== Init ==========
async function init() {
  try {
    document.querySelector('#loading-screen p').textContent = '正在讀取 Google Sheets 資料...';
    const raw = await fetchSheet();
    const rows = raw.values;
    if (!rows || rows.length < 2) {
      showError('查無資料');
      return;
    }
    const headers = rows[0].map(h => String(h || '').trim());
    allData = rows.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = String(row[i] || '').trim());
      return obj;
    }).filter(r => r['時間戳記']);

    filteredData = [...allData];

    // Hide loading, show main
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('mainContent').classList.add('visible');

    toast(`已載入 ${allData.length} 筆記錄！`);
    buildUI();
  } catch (e) {
    console.error('Load error:', e);
    showError('載入失敗：' + e.message + '\n\n請確認網路連線，或聯繫管理者。');
  }
}

// ========== API ==========
async function fetchSheet() {
  const url = `https://gateway.maton.ai/google-sheets/v4/spreadsheets/${SHEET_ID}/values/A1:Z`;
  const resp = await fetch(url, {
    headers: { 'Authorization': `Bearer ${API_KEY}` }
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message || 'API 錯誤');
  return data;
}

// ========== UI Build ==========
function buildUI() {
  try {
    buildFilters();
    buildCharts();
    buildTables();
    updateStats();
  } catch (e) {
    console.error('UI build error:', e);
    toast('部分圖表載入失敗：' + e.message, 'error');
  }
}

function buildFilters() {
  const types = [...new Set(allData.map(r => r['請選擇這場工作坊的類別']).filter(Boolean))].sort();
  const roles = [...new Set(allData.map(r => r['參與者身分']).filter(Boolean))].sort();
  const areas = [...new Set(allData.map(r => r['來自哪個區域']).filter(Boolean))].sort();
  const ranks = [...new Set(allData.map(r => r['目前聘階']).filter(Boolean))].sort();
  const teams = [...new Set(allData.map(r => r['所屬小C']).filter(Boolean))].sort();

  populateSelect('filterType', types);
  populateSelect('filterRole', roles);
  populateSelect('filterArea', areas);
  populateSelect('filterRank', ranks);
  populateSelect('filterTeam', teams);

  // Set date range
  const dates = allData.map(r => r['參與工作坊日期']).filter(d => d && d.match(/^\d{4}\/\d{1,2}\/\d{1,2}/)).sort();
  if (dates.length) {
    document.getElementById('filterDateFrom').value = dates[0];
    document.getElementById('filterDateTo').value = dates[dates.length - 1];
  }
}

function populateSelect(id, values) {
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="">全部</option>';
  values.forEach(v => { if (v) sel.innerHTML += `<option value="${v}">${v}</option>`; });
}

function resetFilters() {
  document.querySelectorAll('.filters select').forEach(s => s.value = '');
  document.querySelectorAll('.filters input').forEach(i => i.value = '');
  filteredData = [...allData];
  buildFilters();
  buildCharts();
  buildTables();
  updateStats();
  toast('已清除篩選');
}

function applyFilters() {
  const type = document.getElementById('filterType').value;
  const role = document.getElementById('filterRole').value;
  const area = document.getElementById('filterArea').value;
  const rank = document.getElementById('filterRank').value;
  const team = document.getElementById('filterTeam').value;
  const dateFrom = document.getElementById('filterDateFrom').value;
  const dateTo = document.getElementById('filterDateTo').value;

  filteredData = allData.filter(r => {
    if (type && r['請選擇這場工作坊的類別'] !== type) return false;
    if (role && r['參與者身分'] !== role) return false;
    if (area && r['來自哪個區域'] !== area) return false;
    if (rank && r['目前聘階'] !== rank) return false;
    if (team && r['所屬小C'] !== team) return false;
    const d = r['參與工作坊日期'];
    if (dateFrom && d < dateFrom) return false;
    if (dateTo && d > dateTo) return false;
    return true;
  });

  buildCharts();
  buildTables();
  updateStats();
}

// ========== Stats ==========
function updateStats() {
  const total = filteredData.length;
  const unique = new Set(filteredData.map(r => r['夥伴姓'] + r['名字'])).size;
  const learner = filteredData.filter(r => r['參與者身分'] === '學習夥伴').length;
  const host = filteredData.filter(r => r['參與者身分'] === '主持人/場控').length;
  const biz = filteredData.filter(r => r['請選擇這場工作坊的類別'] === '經營工作坊').length;
  const teams = new Set(filteredData.map(r => r['所屬小C'])).size;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statUnique').textContent = unique;
  document.getElementById('statLearner').textContent = learner;
  document.getElementById('statHost').textContent = host;
  document.getElementById('statBiz').textContent = biz;
  document.getElementById('statTeams').textContent = teams;

  const dates = filteredData.map(r => r['參與工作坊日期']).filter(Boolean).sort();
  if (dates.length) {
    document.getElementById('statDateRange').textContent = `${dates[0]} ~ ${dates[dates.length-1]}`;
  }
}

// ========== Charts ==========
const COLORS = ['#6366f1','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#14b8a6','#f97316','#84cc16'];
const CHART_OPTS = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { labels: { color: '#94a3b8', font: { size: 12 } } } },
  scales: {
    x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
  }
};

function safeChart(id, config) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  if (chartInstances[id]) { try { chartInstances[id].destroy(); } catch(e) {} }
  const ctx = canvas.getContext('2d');
  chartInstances[id] = new Chart(ctx, config);
}

function buildCharts() {
  if (!filteredData.length) return;
  try {
    buildTrendChart();
    buildTypeChart();
    buildRoleChart();
    buildRankChart();
    buildTeamChart();
    buildAreaChart();
  } catch (e) {
    console.error('Chart build error:', e);
    toast('圖表載入失敗: ' + e.message, 'error');
  }
}

function buildTrendChart() {
  const months = {};
  filteredData.forEach(r => {
    const d = r['參與工作坊日期'];
    if (!d) return;
    const m = d.substring(0, 7);
    months[m] = (months[m] || 0) + 1;
  });
  const sorted = Object.keys(months).sort();
  safeChart('chartTrend', {
    type: 'line',
    data: {
      labels: sorted,
      datasets: [{
        label: '簽到人次',
        data: sorted.map(k => months[k]),
        borderColor: '#6366f1',
        backgroundColor: 'rgba(99,102,241,0.1)',
        fill: true, tension: 0.4, pointRadius: 4, pointHoverRadius: 6
      }]
    },
    options: { ...CHART_OPTS, plugins: { legend: { display: false } } }
  });
}

function buildTypeChart() {
  const counts = {};
  filteredData.forEach(r => { const v = r['請選擇這場工作坊的類別']; if (v) counts[v] = (counts[v]||0)+1; });
  const labels = Object.keys(counts);
  const data = Object.values(counts);
  safeChart('chartType', {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: COLORS.slice(0, labels.length) }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#94a3b8' } } } }
  });

  // Bar by month
  const types = [...new Set(allData.map(r => r['請選擇這場工作坊的類別']).filter(Boolean))].sort();
  const monthSet = [...new Set(filteredData.map(r => r['參與工作坊日期'].substring(0,7)).filter(Boolean))].sort();
  const typeByMonth = {};
  types.forEach(t => { typeByMonth[t] = {}; monthSet.forEach(m => { typeByMonth[t][m] = 0; }); });
  filteredData.forEach(r => { const t = r['請選擇這場工作坊的類別']; const m = r['參與工作坊日期'].substring(0,7); if (t && m) typeByMonth[t][m]++; });
  safeChart('chartTypeBar', {
    type: 'bar',
    data: { labels: monthSet, datasets: types.map((t, i) => ({ label: t, data: monthSet.map(m => typeByMonth[t][m]||0), backgroundColor: COLORS[i % COLORS.length] })) },
    options: { ...CHART_OPTS, plugins: { legend: { display: false } } }
  });
}

function buildRoleChart() {
  const counts = {};
  filteredData.forEach(r => { const v = r['參與者身分']; if (v) counts[v] = (counts[v]||0)+1; });
  safeChart('chartRole', {
    type: 'pie',
    data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: ['#22c55e','#6366f1','#f59e0b'] }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } }
  });
}

function buildRankChart() {
  const counts = {};
  filteredData.forEach(r => { const v = r['目前聘階']; if (v) counts[v] = (counts[v]||0)+1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  safeChart('chartRank', {
    type: 'bar',
    data: { labels: sorted.map(s => s[0]), datasets: [{ label: '人數', data: sorted.map(s => s[1]), backgroundColor: '#8b5cf6' }] },
    options: { ...CHART_OPTS, indexAxis: 'y', plugins: { legend: { display: false } } }
  });
}

function buildTeamChart() {
  const counts = {};
  filteredData.forEach(r => { const v = r['所屬小C']; if (v) counts[v] = (counts[v]||0)+1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 10);
  safeChart('chartTeam', {
    type: 'bar',
    data: { labels: sorted.map(s => s[0]), datasets: [{ label: '簽到次數', data: sorted.map(s => s[1]), backgroundColor: '#06b6d4' }] },
    options: { ...CHART_OPTS, indexAxis: 'y', plugins: { legend: { display: false } } }
  });
}

function buildAreaChart() {
  const counts = {};
  filteredData.forEach(r => { const v = r['來自哪個區域']; if (v) counts[v] = (counts[v]||0)+1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  safeChart('chartArea', {
    type: 'bar',
    data: { labels: sorted.map(s => s[0]), datasets: [{ label: '人數', data: sorted.map(s => s[1]), backgroundColor: '#f59e0b' }] },
    options: { ...CHART_OPTS, plugins: { legend: { display: false } } }
  });
}

// ========== Tables ==========
function buildTables() {
  try {
    buildRecentTable();
    buildTeamTable();
    buildTopParticipants();
  } catch (e) {
    console.error('Table build error:', e);
  }
}

function buildRecentTable() {
  const headers = ['時間戳記','工作坊日期','姓名','區域','聘階','類別','身份','所屬小C'];
  const thead = document.querySelector('#tableRecent thead');
  const tbody = document.querySelector('#tableRecent tbody');
  thead.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;
  const recent = filteredData.slice(-30).reverse();
  tbody.innerHTML = recent.map(r => {
    const name = `${r['夥伴姓']||''}${r['名字']||''}`;
    const type = r['請選擇這場工作坊的類別']||'';
    const role = r['參與者身分']||'';
    return `<tr>
      <td>${r['時間戳記']||''}</td><td>${r['參與工作坊日期']||''}</td><td>${name}</td>
      <td>${r['來自哪個區域']||''}</td><td>${r['目前聘階']||''}</td>
      <td><span class="badge badge-primary">${type}</span></td>
      <td><span class="badge ${role==='學習夥伴'?'badge-success':'badge-warning'}">${role}</span></td>
      <td>${r['所屬小C']||''}</td>
    </tr>`;
  }).join('');
}

function buildTeamTable() {
  const counts = {};
  const learnerCounts = {};
  filteredData.forEach(r => {
    const t = r['所屬小C']; if (!t) return;
    counts[t] = (counts[t]||0) + 1;
    if (r['參與者身分'] === '學習夥伴') learnerCounts[t] = (learnerCounts[t]||0) + 1;
  });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const thead = document.querySelector('#tableTeams thead');
  const tbody = document.querySelector('#tableTeams tbody');
  thead.innerHTML = `<tr><th>#</th><th>小C名稱</th><th>總簽到</th><th>學習夥伴</th><th>主持人</th></tr>`;
  tbody.innerHTML = sorted.map(([team, total], i) => {
    const learner = learnerCounts[team]||0;
    return `<tr>
      <td><span class="badge ${i<3?'badge-warning':'badge-primary'}">#${i+1}</span></td>
      <td style="font-weight:600">${team}</td>
      <td style="font-weight:700;color:var(--primary)">${total}</td>
      <td style="color:var(--success)">${learner}</td>
      <td style="color:var(--warning)">${total-learner}</td>
    </tr>`;
  }).join('');
}

function buildTopParticipants() {
  const counts = {};
  filteredData.forEach(r => {
    const name = `${r['夥伴姓']||''}${r['名字']||''}`;
    if (!name) return;
    if (!counts[name]) counts[name] = { name, total:0, team: r['所屬小C'], rank: r['目前聘階'], type:{} };
    counts[name].total++;
    const t = r['請選擇這場工作坊的類別'];
    counts[name].type[t] = (counts[name].type[t]||0) + 1;
  });
  const sorted = Object.entries(counts).sort((a,b) => b[1].total-a[1].total).slice(0, 20);
  const thead = document.querySelector('#tableTop thead');
  const tbody = document.querySelector('#tableTop tbody');
  thead.innerHTML = `<tr><th>#</th><th>姓名</th><th>總出席</th><th>主要身份</th><th>小C</th><th>經營/招募/領導</th></tr>`;
  tbody.innerHTML = sorted.map(([name, info], i) => {
    const biz = info.type['經營工作坊']||0;
    const rec = info.type['招募工作坊']||0;
    const lead = info.type['領導工作坊']||0;
    return `<tr>
      <td><span class="badge ${i<3?'badge-warning':'badge-primary'}">${i+1}</span></td>
      <td style="font-weight:600">${name}</td>
      <td style="font-weight:700;color:var(--primary)">${info.total}</td>
      <td><span class="badge badge-success">${info.rank||'-'}</span></td>
      <td>${info.team||'-'}</td>
      <td style="font-size:12px">經營:${biz} 招募:${rec} 領導:${lead}</td>
    </tr>`;
  }).join('');
}

// ========== CSV Export ==========
function exportCSV() {
  if (!filteredData.length) { toast('無資料可匯出', 'error'); return; }
  const headers = ['時間戳記','參與工作坊日期','夥伴姓','名字','來自哪個區域','目前聘階','請選擇這場工作坊的類別','參與者身分','所屬小C'];
  const rows = filteredData.map(r => headers.map(h => `"${(r[h]||'').replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `工作坊簽到_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV 已匯出！');
}

// ========== Event Listeners ==========
document.querySelectorAll('.filters select, .filters input').forEach(el => el.addEventListener('change', applyFilters));

// ========== Start ==========
init();
</script>
</body>
