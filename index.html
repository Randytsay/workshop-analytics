<!DOCTYPE html>
<html>
<head>
 <meta charset="utf-8">
 <title>工作坊統計圖表</title>
 <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
 <style>
 :root {
 --primary-accent: #4285f4;
 --secondary-accent: #34a853;
 --border-color: #ddd;
 --panel-bg: #fff;
 --text-color: #333;
 --label-color: #666;
 }

 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
 margin: 15px;
 background-color: #f0f2f5;
 color: var(--text-color);
 font-size: 14px;
 }

 .main-container {
 display: flex;
 flex-direction: column;
 gap: 15px;
 max-width: 1300px;
 margin: 0 auto;
 }

 .controls-container {
 padding: 15px;
 background-color: var(--panel-bg);
 border-radius: 6px;
 box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
 margin-bottom: 15px;
 }

 .row {
 display: flex;
 align-items: center;
 gap: 10px;
 margin-bottom: 12px;
 }

 label {
 width: 110px;
 font-size: 0.9em;
 color: var(--label-color);
 flex-shrink: 0;
 }

 select,
 button {
 padding: 8px 12px;
 font-size: 0.9em;
 border-radius: 4px;
 border: 1px solid var(--border-color);
 }

 select {
 flex-grow: 1;
 min-width: 150px;
 }

 button {
 cursor: pointer;
 background-color: var(--primary-accent);
 color: white;
 }

 button:disabled {
 background-color: #ccc;
 cursor: not-allowed;
 }

 button#generateButton {
 background-color: var(--secondary-accent);
 }

 .loader {
 border: 4px solid #f3f3f3;
 border-top: 4px solid var(--primary-accent);
 border-radius: 50%;
 width: 24px;
 height: 24px;
 animation: spin 1s linear infinite;
 display: none;
 margin-left: 10px;
 }

 @keyframes spin {
 0% { transform: rotate(0deg); }
 100% { transform: rotate(360deg); }
 }

 .content-wrapper {
 display: flex;
 flex-direction: column;
 gap: 20px;
 }

 .charts-grid {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
 gap: 20px;
 }

 .chart-wrapper,
 .participant-table-wrapper {
 border: 1px solid var(--border-color);
 padding: 15px;
 border-radius: 6px;
 background-color: var(--panel-bg);
 box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
 display: flex;
 flex-direction: column;
 min-height: 420px;
 }

 .chart-container {
 width: 100%;
 height: 380px;
 flex-grow: 1;
 }

 .download-button-wrapper {
 text-align: right;
 margin-bottom: 8px;
 }
 .download-button-wrapper button {
 padding: 6px 10px;
 font-size: 0.8em;
 background-color: #6c757d;
 }
 .download-button-wrapper button:hover {
 background-color: #5a6268;
 }

 .participant-table-wrapper h3 {
 margin-top: 0;
 margin-bottom: 10px;
 font-size: 1.1em;
 color: var(--text-color);
 border-bottom: 1px solid var(--border-color);
 padding-bottom: 8px;
 flex-shrink: 0;
 }

 #participantTableContainer {
 flex-grow: 1;
 overflow-y: auto;
 border: 1px solid var(--border-color);
 padding: 0;
 }

 #participantTableContainer table {
 width: 100%;
 border-collapse: collapse;
 font-size: 0.9em;
 }

 #participantTableContainer th,
 #participantTableContainer td {
 border-bottom: 1px solid var(--border-color);
 border-left: none;
 border-right: none;
 border-top: none;
 padding: 8px 10px;
 text-align: left;
 }

 #participantTableContainer th {
 background-color: #f0f2f5;
 font-weight: bold;
 position: sticky;
 top: 0;
 }
 #participantTableContainer tr:nth-child(even) td {
 background-color: #f9f9f9;
 }

 #participantTableContainer tr:hover td {
 background-color: #e9ecef;
 }
 </style>
</head>
<body>
 <div class="main-container">
 <div class="controls-container">
 <div class="row">
 <label for="yearSelect">選擇年份:</label>
 <select id="yearSelect"><option value="">讀取中...</option></select>
 </div>
 <div class="row">
 <label for="dateSelect">工作坊日期:</label>
 <select id="dateSelect" disabled><option value="">---</option></select>
 </div>
 <div class="row">
 <label for="categorySelect">工作坊類別:</label>
 <select id="categorySelect" disabled><option value="">---</option></select>
 </div>
 <div class="row">
 <button id="generateButton" disabled>生成統計圖與名單</button>
 <div id="loader" class="loader"></div>
 </div>
 </div>

 <div class="content-wrapper">
 <div class="charts-grid">
 <div class="chart-wrapper">
 <div class="download-button-wrapper">
 <button onclick="app.downloadChartInstance('roseChart', '玫瑰圖')">下載</button>
 </div>
 <div id="chartContainerRose" class="chart-container"></div>
 </div>
 <div class="chart-wrapper">
 <div class="download-button-wrapper">
 <button onclick="app.downloadChartInstance('barVChart', '柱狀圖')">下載</button>
 </div>
 <div id="chartContainerBarV" class="chart-container"></div>
 </div>
 <div class="chart-wrapper">
 <div class="download-button-wrapper">
 <button onclick="app.downloadChartInstance('barHChart', '條形圖')">下載</button>
 </div>
 <div id="chartContainerBarH" class="chart-container"></div>
 </div>
 <div class="participant-table-wrapper">
 <h3>參與者詳細名單</h3>
 <div id="participantTableContainer">
 <p id="noParticipantMessage" style="text-align:center; color:#888; padding: 20px;">請選擇條件並點擊「生成統計圖與名單」。</p>
 </div>
 </div>
 </div>
 </div>
 </div>

 <script>
 const app = {};
 app.echartsInstances = {};
 app.currentData = { stats: [], participants: [] };

 const colorGradients = [
 ['#5470c6', '#2c3e88'],
 ['#91cc75', '#3f8a2f'],
 ['#fac858', '#d99c0d'],
 ['#ee6666', '#b13939'],
 ['#73c0de', '#3b8dad'],
 ['#ea7ccc', '#b13e8f'],
 ['#63D4A3', '#34A87C'],
 ['#fc8452', '#d95b21'],
 ['#9a60b4', '#6b3e81'],
 ];

 function getItemStyleForChart(index, chartType = 'bar', orientation = 'vertical') {
 const gradient = colorGradients[index % colorGradients.length];
 let itemStyle = {
 color: {
 type: 'linear',
 x: 0, y: 0, x2: 0, y2: 1,
 colorStops: [{ offset: 0, color: gradient[0] }, { offset: 1, color: gradient[1] }]
 },
 borderRadius: 4,
 shadowBlur: 10,
 shadowColor: 'rgba(0,0,0,0.1)',
 shadowOffsetX: 0,
 shadowOffsetY: 1,
 borderWidth: chartType === 'rose' ? 0.5 : 0,
 borderColor: chartType === 'rose' ? 'rgba(0,0,0,0.1)' : undefined
 };
 if (chartType === 'bar') {
 itemStyle.borderRadius = orientation === 'vertical' ? [4,4,0,0] : [0,4,4,0];
 itemStyle.shadowColor = 'rgba(0,0,0,0.15)';
 itemStyle.shadowOffsetY = 2;
 if (orientation === 'horizontal') {
 itemStyle.color.x2 = 1;
 itemStyle.color.y2 = 0;
 }
 } else if (chartType === 'rose') {
 itemStyle.borderRadius = 6;
 }
 return itemStyle;
 }

 // ========== Config ==========
 const API_KEY = 'v2.BYXneOcP6Bv73dvpyiE_tUZQtFxobX4KB3ruQWCMxOfveEkzVnmOwUk5ugf9H2K_QjOQRG4jxEJkONVa6oJ0K38OBygg0LtRx2lw-hF5zIU6WC9Jrz5t3rlx';
 const SHEET_ID = '1QEytkFQTYVgkwCxgcC4BKrvf9ZkC_GApJd1U6JQAnsI';
 const SHEET_NAME = '簽到記錄表';

 let allRawData = [];

 // ========== Init ==========
 document.addEventListener('DOMContentLoaded', function () {
 app.echartsInstances.roseChart = echarts.init(document.getElementById('chartContainerRose'));
 app.echartsInstances.barVChart = echarts.init(document.getElementById('chartContainerBarV'));
 app.echartsInstances.barHChart = echarts.init(document.getElementById('chartContainerBarH'));

 window.addEventListener('resize', function() {
 for (const key in app.echartsInstances) {
 if (app.echartsInstances[key] && app.echartsInstances[key].resize) {
 app.echartsInstances[key].resize();
 }
 }
 });

 clearAllChartsAndTable();
 showLoader(true);

 fetchSheetData().then(raw => {
 allRawData = raw;
 showLoader(false);
 populateYears();
 }).catch(err => {
 showLoader(false);
 alert('讀取資料失敗：' + err.message);
 });
 });

 // ========== API ==========
 async function fetchSheetData() {
 const url = `https://gateway.maton.ai/google-sheets/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(SHEET_NAME)}!A1:Z`;
 const resp = await fetch(url, {
 headers: { 'Authorization': `Bearer ${API_KEY}` }
 });
 if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
 const data = await resp.json();
 if (data.error) throw new Error(data.error.message || 'API 錯誤');
 return data.values || [];
 }

 // ========== Loader ==========
 function showLoader(isLoading) {
 document.getElementById('loader').style.display = isLoading ? 'inline-block' : 'none';
 }

 // ========== Populate ==========
 function populateYears() {
 const select = document.getElementById('yearSelect');
 const years = new Set();
 allRawData.slice(1).forEach(row => {
 const dateStr = (row[1] || '').trim();
 const match = dateStr.match(/^(\d{4})\//);
 if (match) years.add(match[1]);
 });

 const sortedYears = Array.from(years).sort((a,b) => b - a);
 select.innerHTML = '<option value="">請選擇年份</option>';
 sortedYears.forEach(y => {
 const opt = document.createElement('option');
 opt.value = y; opt.textContent = y;
 select.appendChild(opt);
 });

 if (sortedYears.length > 0) {
 select.value = sortedYears[0];
 select.dispatchEvent(new Event('change'));
 }
 }

 function populateDates(year) {
 const select = document.getElementById('dateSelect');
 const dates = new Set();
 allRawData.slice(1).forEach(row => {
 const dateStr = (row[1] || '').trim();
 if (dateStr.startsWith(year + '/') || dateStr.startsWith(year + '-')) {
 dates.add(dateStr);
 }
 });

 const sortedDates = Array.from(dates).sort((a,b) => new Date(b) - new Date(a));
 select.innerHTML = '<option value="">請選擇日期</option>';
 select.disabled = false;
 sortedDates.forEach(d => {
 const opt = document.createElement('option');
 opt.value = d; opt.textContent = d;
 select.appendChild(opt);
 });

 if (sortedDates.length > 0) {
 select.value = sortedDates[0];
 select.dispatchEvent(new Event('change'));
 } else {
 select.innerHTML = '<option value="">該年份無工作坊日期</option>';
 select.disabled = true;
 document.getElementById('categorySelect').innerHTML = '<option value="">---</option>';
 document.getElementById('categorySelect').disabled = true;
 document.getElementById('generateButton').disabled = true;
 }
 }

 function populateCategories(date) {
 const select = document.getElementById('categorySelect');
 const cats = new Set();
 allRawData.slice(1).forEach(row => {
 if ((row[1] || '').trim() === date) {
 const cat = (row[6] || '').trim();
 if (cat) cats.add(cat);
 }
 });

 const sortedCats = Array.from(cats);
 select.innerHTML = '<option value="">請選擇類別</option>';
 select.disabled = false;
 sortedCats.forEach(c => {
 const opt = document.createElement('option');
 opt.value = c; opt.textContent = c;
 select.appendChild(opt);
 });

 if (sortedCats.length > 0) {
 select.value = sortedCats[0];
 select.dispatchEvent(new Event('change'));
 } else {
 select.innerHTML = '<option value="">該日期無工作坊類別</option>';
 select.disabled = true;
 document.getElementById('generateButton').disabled = true;
 }
 }

 // ========== Events ==========
 document.getElementById('yearSelect').addEventListener('change', function () {
 const year = this.value;
 if (!year) {
 document.getElementById('dateSelect').innerHTML = '<option value="">---</option>';
 document.getElementById('dateSelect').disabled = true;
 document.getElementById('categorySelect').innerHTML = '<option value="">---</option>';
 document.getElementById('categorySelect').disabled = true;
 document.getElementById('generateButton').disabled = true;
 clearAllChartsAndTable();
 return;
 }
 showLoader(true);
 setTimeout(() => {
 populateDates(year);
 showLoader(false);
 }, 50);
 });

 document.getElementById('dateSelect').addEventListener('change', function () {
 const date = this.value;
 if (!date) {
 document.getElementById('categorySelect').innerHTML = '<option value="">---</option>';
 document.getElementById('categorySelect').disabled = true;
 document.getElementById('generateButton').disabled = true;
 clearAllChartsAndTable();
 return;
 }
 showLoader(true);
 setTimeout(() => {
 populateCategories(date);
 showLoader(false);
 }, 50);
 });

 document.getElementById('categorySelect').addEventListener('change', function () {
 document.getElementById('generateButton').disabled = !this.value;
 clearAllChartsAndTable();
 });

 document.getElementById('generateButton').addEventListener('click', function () {
 const year = document.getElementById('yearSelect').value;
 const date = document.getElementById('dateSelect').value;
 const category = document.getElementById('categorySelect').value;
 if (!year || !date || !category) {
 alert('請選擇完整的年份、日期和類別！');
 return;
 }
 showLoader(true);
 this.disabled = true;
 clearAllChartsAndTable();
 setTimeout(() => {
 processAndRenderData(year, date, category);
 showLoader(false);
 this.disabled = false;
 }, 50);
 });

 // ========== Clear ==========
 function clearAllChartsAndTable() {
 const placeholderText = '請選擇條件並點擊「生成統計圖與名單」';
 const placeholderOption = {
 title: { text: placeholderText, left: 'center', top: 'center', textStyle: { color: '#b0b0b0', fontSize: 14 } }
 };
 for (const key in app.echartsInstances) {
 if (app.echartsInstances[key]) {
 app.echartsInstances[key].clear();
 app.echartsInstances[key].setOption(placeholderOption, true);
 }
 }
 document.getElementById('participantTableContainer').innerHTML =
 `<p style="text-align:center; color:#888; padding: 20px;">${placeholderText.replace('生成統計圖與名單', '查看參與者名單')}</p>`;
 app.currentData = { stats: [], participants: [] };
 }

 // ========== Render Table ==========
 function renderParticipantTable(participants) {
 const tableContainer = document.getElementById('participantTableContainer');
 tableContainer.innerHTML = '';
 if (!participants || participants.length === 0) {
 tableContainer.innerHTML = '<p style="text-align:center; color:#888; padding: 20px;">該條件下無參與者詳細資料。</p>';
 return;
 }
 const table = document.createElement('table');
 const thead = table.createTHead();
 const tbody = table.createTBody();
 const headerRow = thead.insertRow();
 ['名字', '區域', '聘階', '身份'].forEach(text => {
 const th = document.createElement('th');
 th.textContent = text;
 headerRow.appendChild(th);
 });

 let currentXiaoCName = null;
 participants.forEach(p => {
 if (p.xiaoCName !== currentXiaoCName) {
 currentXiaoCName = p.xiaoCName;
 const groupRow = tbody.insertRow();
 const cell = groupRow.insertCell();
 cell.colSpan = 4;
 cell.textContent = currentXiaoCName;
 cell.style.fontWeight = 'bold';
 cell.style.paddingTop = '12px';
 cell.style.paddingBottom = '4px';
 cell.style.backgroundColor = '#e6f4ea';
 cell.style.borderTop = '2px solid #ccc';
 }

 const tr = tbody.insertRow();
 [p.name, p.area, p.rank, p.role].forEach((val, i) => {
 const td = tr.insertCell();
 td.textContent = val || '-';
 });
 });

 tableContainer.appendChild(table);
 }

 // ========== Process & Render ==========
 function processAndRenderData(year, date, category) {
 const filtered = allRawData.slice(1).filter(row => {
 const rowDate = (row[1] || '').trim();
 const rowCat = (row[6] || '').trim();
 return rowDate === date && rowCat === category;
 });

 // Build stats by 小C
 const statsMap = {};
 const participantList = [];

 filtered.forEach(row => {
 const firstName = (row[2] || '').trim();
 const lastName = (row[3] || '').trim();
 const name = lastName + firstName;
 const xiaoC = (row[8] || '').trim();
 const area = (row[4] || '').trim();
 const rank = (row[5] || '').trim();
 const role = (row[7] || '').trim();

 if (xiaoC) {
 statsMap[xiaoC] = (statsMap[xiaoC] || 0) + 1;
 }
 participantList.push({ name, xiaoCName: xiaoC, area, rank, role });
 });

 const statsData = Object.entries(statsMap).map(([name, value]) => ({ name, value }));

 app.currentData = { stats: statsData, participants: participantList };
 renderCharts(statsData, date, category);
 renderParticipantTable(participantList);
 }

 // ========== Charts ==========
 function renderCharts(statsData, date, category) {
 const noDataOption = {
 title: { text: '無符合條件的統計數據', left: 'center', top: 'center', textStyle: { color: '#888', fontSize: 16 } }
 };

 if (!statsData || statsData.length === 0) {
 app.echartsInstances.roseChart.setOption(noDataOption, true);
 app.echartsInstances.barVChart.setOption(noDataOption, true);
 app.echartsInstances.barHChart.setOption(noDataOption, true);
 return;
 }

 let total = 0;
 statsData.forEach(i => { total += i.value; });
 const commonSubtext = `${date} - ${category}`;
 const titleSuffixWithTotal = `（共 ${total} 人）`;

 const baseTitleStyle = {
 left: 'center',
 textStyle: { fontSize: 16, fontWeight: '600' },
 subtextStyle: { fontSize: 12, color: '#555', lineHeight: 18 }
 };

 // Rose Chart
 const roseOption = {
 title: { ...baseTitleStyle, text: `各小C參與人數 ${titleSuffixWithTotal}`, subtext: commonSubtext },
 tooltip: { trigger: 'item', formatter: params => `${params.name}: ${params.value}人 (${params.percent.toFixed(1)}%)` },
 series: [{
 name: '參與人數',
 type: 'pie',
 radius: '65%',
 center: ['50%', '58%'],
 roseType: 'area',
 data: statsData.map((item, index) => ({
 name: item.name,
 value: item.value,
 itemStyle: getItemStyleForChart(index, 'rose')
 })),
 label: {
 show: true,
 formatter: function(params) {
 return `${params.name}\n${params.value}人\n(${params.percent.toFixed(1)}%)`;
 },
 minMargin: 5,
 edgeDistance: '5%',
 lineHeight: 15,
 fontSize: 10
 },
 labelLine: { smooth: 0.2, length: 8, length2: 12 },
 emphasis: { itemStyle: { shadowBlur: 15, shadowColor: 'rgba(0,0,0,0.3)' } }
 }]
 };
 app.echartsInstances.roseChart.setOption(roseOption, true);

 // Bar V
 const barVOption = {
 title: { ...baseTitleStyle, text: `各小C參與人數 ${titleSuffixWithTotal}`, subtext: commonSubtext },
 tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
 grid: { left: '3%', right: '4%', bottom: '12%', top: '30%', containLabel: true },
 xAxis: {
 type: 'category',
 data: statsData.map(i => i.name),
 axisLabel: { interval: 0, rotate: statsData.length > 5 ? 30 : 0, fontSize: 11, margin: 10 }
 },
 yAxis: { type: 'value', name: '人數', nameTextStyle: { fontSize: 11, padding: [0,0,0,30] } },
 series: [{
 name: '參與人數',
 type: 'bar',
 barWidth: '55%',
 data: statsData.map((item, index) => ({
 value: item.value,
 itemStyle: getItemStyleForChart(index, 'bar', 'vertical')
 })),
 label: { show: true, position: 'top', formatter: function(p) { return p.value + '人'; }, fontSize: 10, color: '#444' }
 }]
 };
 app.echartsInstances.barVChart.setOption(barVOption, true);

 // Bar H
 const barHOption = {
 title: { ...baseTitleStyle, text: `各小C參與人數 ${titleSuffixWithTotal}`, subtext: commonSubtext },
 tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
 grid: { left: '12%', right: '15%', bottom: '3%', top: '30%', containLabel: true },
 xAxis: { type: 'value', name: '人數', nameTextStyle: { fontSize: 11 } },
 yAxis: {
 type: 'category',
 data: statsData.map(i => i.name),
 axisLabel: { interval: 0, fontSize: 11, margin: 10 }
 },
 series: [{
 name: '參與人數',
 type: 'bar',
 barWidth: '55%',
 data: statsData.map((item, index) => ({
 value: item.value,
 itemStyle: getItemStyleForChart(index, 'bar', 'horizontal')
 })),
 label: { show: true, position: 'right', formatter: function(p) { return p.value + '人'; }, fontSize: 10, color: '#444' }
 }]
 };
 app.echartsInstances.barHChart.setOption(barHOption, true);
 }

 // ========== Download ==========
 app.downloadChartInstance = function(instanceKey, chartNamePrefix) {
 if (app.echartsInstances[instanceKey] && app.currentData.stats && app.currentData.stats.length > 0) {
 const chartInstance = app.echartsInstances[instanceKey];
 const date = document.getElementById('dateSelect').value || "未選日期";
 const category = document.getElementById('categorySelect').value || "未選類別";
 const safeDate = date.replace(/\//g, '-');
 const fileName = `${safeDate}-${category}.png`;
 const url = chartInstance.getDataURL({
 type: 'png',
 pixelRatio: 2,
 backgroundColor: '#fff'
 });
 const a = document.createElement('a');
 a.href = url;
 a.download = fileName;
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
 } else {
 alert('圖表中無數據可供下載。');
 }
 };
 </script>
</body>
</html>
